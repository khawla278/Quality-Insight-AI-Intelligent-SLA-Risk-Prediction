<div class="home-page">

  <!-- =====================================================
       HERO
  ====================================================== -->

  <section class="hero-section">
    <div class="hero-inner">

      <h1 class="hero-title">
        SLA Risk Prediction
        <span class="hero-subtitle-line">For Non-Conformance Management</span>
      </h1>

      <p class="hero-desc">
        Choose a study to open its ticketing workspace and assess SLA risk
        while creating a new incident or non-conformance record.
      </p>

    </div>
  </section>


  <!-- =====================================================
       STUDY CARDS
  ====================================================== -->

  <section class="studies-section">

    <div class="studies-inner">

      <!-- SECTION LABEL -->
      <div class="section-label-row">
        <div class="section-label-line"></div>
        <span class="section-label-text">Select an active research model to begin</span>
        <div class="section-label-line"></div>
      </div>

      <!-- CARDS GRID -->
      <div class="cards-grid">

        <!-- CARD 01 — IT Incident Log -->
        <button type="button" class="study-card card-blue" (click)="openStudy('incident')">

          <div class="card-header">
            <div class="card-meta-top">
              <span class="study-index">01 — PROXY STUDY</span>
              <span class="status-badge badge-live">
                <span class="status-dot"></span>
                LIVE
              </span>
            </div>
            <h2 class="card-title">IT Incident Log</h2>
            <p class="card-dataset">25K+ records &nbsp;·&nbsp; 12K+ incidents</p>
          </div>

          <div class="card-body">
            <p class="card-question">
              Open the IT service ticket workspace and predict SLA breach risk at ticket creation.
            </p>
          </div>

          <div class="card-footer">
            <div class="card-metrics">
              <div class="metric">
                <span class="metric-value">~80%</span>
                <span class="metric-label">Accuracy</span>
              </div>
              <div class="metric-divider"></div>
              <div class="metric">
                <span class="metric-value">0.84</span>
                <span class="metric-label">ROC-AUC</span>
              </div>
            </div>
            <div class="card-cta">
              Launch Predictor
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M5 12h14M12 5l7 7-7 7"/>
              </svg>
            </div>
          </div>

        </button>


        <!-- CARD 02 — Crossrail NCR -->
        <button type="button" class="study-card card-orange" (click)="openStudy('crossrail')">

          <div class="card-header">
            <div class="card-meta-top">
              <span class="study-index">02 — DOMAIN STUDY</span>
              <span class="status-badge badge-active">
                <span class="status-dot"></span>
                ACTIVE
              </span>
            </div>
            <h2 class="card-title">Crossrail NCR</h2>
            <p class="card-dataset">25K+ real-world non-conformance records</p>
          </div>

          <div class="card-body">
            <p class="card-question">
              Create a Crossrail non-conformance record and assess the risk of a late close-out with the NCR model.
            </p>
          </div>

          <div class="card-footer">
            <div class="card-metrics">
              <div class="metric">
                <span class="metric-value">~80%</span>
                <span class="metric-label">Accuracy</span>
              </div>
              <div class="metric-divider"></div>
              <div class="metric">
                <span class="metric-value">0.84</span>
                <span class="metric-label">ROC-AUC</span>
              </div>
            </div>
            <div class="card-cta">
              Launch Predictor
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M5 12h14M12 5l7 7-7 7"/>
              </svg>
            </div>
          </div>

        </button>

      </div><!-- /cards-grid -->

    </div><!-- /studies-inner -->

  </section>

</div>
